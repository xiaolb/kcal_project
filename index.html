<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <title>燃脂记录</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">今日打卡</p>
        <h1>燃脂记录</h1>
      </div>
      <div class="status-pill" id="storageStatus" aria-live="polite">准备就绪</div>
    </header>

    <main class="app-main">
      <section class="view view-active" id="recordView" aria-labelledby="recordTitle">
        <div class="checkin-panel">
          <div class="date-row">
            <div>
              <p class="section-kicker">记录</p>
              <h2 id="recordTitle">今日消耗</h2>
            </div>
            <time id="todayLabel" class="today-label">今天</time>
          </div>

          <div class="today-summary" aria-label="今日汇总">
            <div class="summary-tile primary">
              <span>消耗</span>
              <strong id="todayCalories">0</strong>
              <em>kcal</em>
            </div>
            <div class="summary-tile">
              <span>约合脂肪</span>
              <strong id="todayFat" class="fat-pair">0</strong>
              <em>g</em>
            </div>
          </div>

          <form id="recordForm" class="record-form" novalidate>
            <label for="caloriesInput">今日消耗大卡</label>
            <div class="input-row">
              <input
                id="caloriesInput"
                name="calories"
                type="number"
                inputmode="decimal"
                min="0"
                step="1"
                placeholder="例如 360"
                autocomplete="off"
                aria-describedby="recordError"
              >
              <span aria-hidden="true">kcal</span>
            </div>
            <p id="recordError" class="form-error" role="alert" aria-live="polite"></p>
            <button id="recordSubmit" class="primary-button" type="submit">添加记录</button>
          </form>
        </div>

      </section>

      <section class="view" id="statsView" aria-labelledby="statsTitle">
        <div class="stats-toolbar">
          <div>
            <p class="section-kicker">统计</p>
            <h2 id="statsTitle">燃脂趋势</h2>
          </div>
          <button id="refreshStatsButton" class="icon-button" type="button" aria-label="刷新统计">刷新</button>
        </div>

        <div class="segments" role="group" aria-label="统计范围">
          <button class="segment is-active" type="button" data-range-type="week">周</button>
          <button class="segment" type="button" data-range-type="month">月</button>
          <button class="segment" type="button" data-range-type="halfYear">半年</button>
          <button class="segment" type="button" data-range-type="custom">自定义</button>
        </div>

        <div class="field-stack">
          <label for="selectedDateInput">选择日期</label>
          <input id="selectedDateInput" type="date">
        </div>

        <div id="customRange" class="custom-range" hidden>
          <div class="field-stack">
            <label for="startDateInput">开始日期</label>
            <input id="startDateInput" type="date">
          </div>
          <div class="field-stack">
            <label for="endDateInput">结束日期</label>
            <input id="endDateInput" type="date">
          </div>
        </div>
        <p id="rangeTip" class="range-tip" aria-live="polite"></p>

        <div class="summary-grid" aria-label="区间汇总">
          <div class="summary-card">
            <span>总消耗</span>
            <strong id="summaryCalories">0</strong>
            <em>kcal</em>
          </div>
          <div class="summary-card">
            <span>体脂等量</span>
            <strong id="summaryBodyFat">0</strong>
            <em>g</em>
          </div>
          <div class="summary-card">
            <span>纯脂肪</span>
            <strong id="summaryPureFat">0</strong>
            <em>g</em>
          </div>
        </div>

        <section class="chart-panel" aria-labelledby="rangeLabel">
          <div class="panel-heading">
            <h2 id="rangeLabel">最近 7 天</h2>
          </div>
          <div id="barChart" class="bar-chart" aria-label="消耗大卡柱状图"></div>
        </section>

        <section class="list-panel" aria-labelledby="recordListTitle">
          <div class="panel-heading">
            <h2 id="recordListTitle">记录明细</h2>
          </div>
          <ul id="recordList" class="record-list" aria-live="polite"></ul>
        </section>

        <section class="import-export" aria-labelledby="dataToolsTitle">
          <h2 id="dataToolsTitle">数据工具</h2>
          <div class="tool-row">
            <button id="exportButton" class="secondary-button" type="button">导出</button>
            <label class="file-button" for="importInput">导入</label>
            <input
              id="importInput"
              class="visually-hidden"
              type="file"
              accept=".doc,.html,text/html,application/msword"
            >
          </div>
          <p id="importResult" class="import-result" aria-live="polite"></p>
        </section>
      </section>
    </main>
  </div>

  <nav class="bottom-tabs" aria-label="主导航">
    <button class="tab is-active" type="button" data-target="recordView" aria-controls="recordView">记录</button>
    <button class="tab" type="button" data-target="statsView" aria-controls="statsView">统计</button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
